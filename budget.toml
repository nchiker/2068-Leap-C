# 2068-Leap-C ROM budgets (spec.md section 2.2) and the budget ledger (project_plan.md section 1.2).
#
# tools/budget.py measures every component from the production symbol files: a component is a
# list of [start_label, end_label) address ranges. `make budget` prints the table and the ROM map;
# `make check` fails when
#   - a component is larger than its budget (base budget + ledger changes),
#   - code in a bank is not covered by exactly one component (unaccounted bytes),
#   - the reserve after the ledger falls below the bank's floor (owner decision 4, 2026-10-13).
# Components with no ranges yet have no code yet (their milestone has not started).

[home]
size = 16384
code_end = "LEAPC_HOME_CODE_END"
reserve_floor = 512

[[home.component]]
id = "page0"
title = "Page zero, cold start, trampolines"
budget = 160
ranges = [["COMP_PAGE0_BEGIN", "COMP_PAGE0_END"], ["COMP_TRAMP_BEGIN", "COMP_TRAMP_END"]]

[[home.component]]
id = "platform"
title = "Retained platform (graphics, memory, keyboard, math, interrupt, bank, AY) + deltas (the editor-only parts in the EXROM: D11, D12)"
budget = 3800
ranges = [["COMP_PLATFORM_BEGIN", "COMP_PLATFORM_END"]]

[[home.component]]
id = "tape_block"
title = "Tape block send/receive (moved from EXROM in Phase 7; platform delta D9)"
budget = 340
ranges = [["COMP_TAPE_BEGIN", "COMP_TAPE_END"]]

[[home.component]]
id = "lexer"
title = "Compiler: lexer + source streaming (+ compile error exit; the keyword table in the EXROM since Phase 8)"
budget = 1100
ranges = [["COMP_LEXER_BEGIN", "COMP_LEXER_END"]]

[[home.component]]
id = "decl"
title = "Compiler: declarations and type system"
budget = 2000
ranges = [["COMP_DECL_BEGIN", "COMP_DECL_END"]]

[[home.component]]
id = "symtab"
title = "Compiler: scoped symbol table"
budget = 800
ranges = [["COMP_SYMTAB_BEGIN", "COMP_SYMTAB_END"]]

[[home.component]]
id = "expr"
title = "Compiler: typed expressions"
budget = 1800
ranges = [["COMP_EXPR_BEGIN", "COMP_EXPR_END"]]

[[home.component]]
id = "codegen"
title = "Compiler: code generator (templates, fixups, constant folding)"
budget = 1200
ranges = [["COMP_CODEGEN_BEGIN", "COMP_CODEGEN_END"]]

[[home.component]]
id = "stmt"
title = "Compiler: statements and functions"
budget = 1400
ranges = [["COMP_STMT_BEGIN", "COMP_STMT_END"]]

[[home.component]]
id = "preproc"
title = "Compiler: preprocessor (the directive hook and macro expansion; the directives in the EXROM since Phase 8)"
budget = 300
ranges = [["COMP_PREPROC_BEGIN", "COMP_PREPROC_END"]]

[[home.component]]
id = "helpers"
title = "Runtime: helper core"
budget = 500
ranges = [["COMP_HELPERS_BEGIN", "COMP_HELPERS_END"]]

[[home.component]]
id = "library"
title = "Runtime: library (leap.h) (its compiler binding in the EXROM since Phase 8)"
budget = 1300
ranges = [["COMP_LIBRARY_BEGIN", "COMP_LIBRARY_END"]]

[[home.component]]
id = "float"
title = "Runtime: floating point (F_OP and the trampoline to the float core, loads, stores, slots; Phase 8)"
budget = 0
ranges = [["COMP_FLOAT_BEGIN", "COMP_FLOAT_END"]]

[[home.component]]
id = "rtexit"
title = "Runtime: start, exit, BREAK, runtime errors"
budget = 200
ranges = [["COMP_RTEXIT_BEGIN", "COMP_RTEXIT_END"]]

[[home.component]]
id = "slots"
title = "The loaded library's jump table: 16 slots of `jp` at $3FD0, the end of the ROM (Phase 10; include/leapc_lib.inc)"
budget = 0
pinned = true
ranges = [["COMP_SLOTS_BEGIN", "COMP_SLOTS_END"]]

[exrom]
size = 8192
base = 0xC000
code_end = "LEAPC_EXROM_CODE_END"
reserve_floor = 256

[[exrom.component]]
id = "xplatform"
title = "Retained platform (editor engine, tape headers, integer formatting, sound; the editor-only line edits and text output, D11 D12)"
budget = 1340
ranges = [["COMP_XPLATFORM_BEGIN", "COMP_XPLATFORM_END"]]

[[exrom.component]]
id = "xtape_block"
title = "Tape block send/receive (in EXROM until Phase 7, ledger L1; moved to HOME, L37)"
budget = 0
ranges = []

[[exrom.component]]
id = "xshell"
title = "Leap-C shell (entry points, editor glue, commands, messages, chime; the tape commands and the library's tape service)"
budget = 2900
ranges = [["COMP_XSHELL_BEGIN", "COMP_XCOMP_ENTRY"], ["COMP_XCOMP_ENTRY_END", "COMP_XFP_ENTRY"], ["COMP_XFP_ENTRY_END", "COMP_XSHELL_END"]]

[[exrom.component]]
id = "xkeywords"
title = "C keyword highlighting (the scanner; the keyword table is the compiler's, in xcomp)"
budget = 250
ranges = [["COMP_XKEYWORDS_BEGIN", "COMP_XKEYWORDS_END"]]

[[exrom.component]]
id = "xdiag"
title = "Compiler diagnostics (message texts, error reporting)"
budget = 650
ranges = [["COMP_XDIAG_BEGIN", "COMP_XDIAG_END"]]

[[exrom.component]]
id = "xcomp"
title = "Compiler parts run through HOME trampolines (constant folding L5; the library's names L19; Phase 8: keywords, TY_EQUAL, the binding, the directives)"
budget = 0
ranges = [["COMP_XCOMP_ENTRY", "COMP_XCOMP_ENTRY_END"], ["COMP_XCOMP_BEGIN", "COMP_XCOMP_END"]]

[[exrom.component]]
id = "xfp"
title = "The float core (the re-engineered FP calculator + float formatting, spec.md 4.9; Phase 8)"
budget = 2165
ranges = [["COMP_XFP_ENTRY", "COMP_XFP_ENTRY_END"], ["COMP_XFP_BEGIN", "COMP_XFP_END"]]

