# 2068-Leap-C ROM budgets (spec.md section 2.2) and the budget ledger (project_plan.md section 1.2).
#
# tools/budget.py measures every component from the production symbol files: a component is a
# list of [start_label, end_label) address ranges. `make budget` prints the table and the ROM map;
# `make check` fails when
#   - a component is larger than its budget (base budget + ledger changes),
#   - code in a bank is not covered by exactly one component (unaccounted bytes),
#   - the reserve after the ledger falls below the bank's floor (owner decision 4, 2026-10-13).
# Components with no ranges yet have no code yet (their milestone has not started).

[home]
size = 16384
code_end = "LEAPC_HOME_CODE_END"
reserve_floor = 512

[[home.component]]
id = "page0"
title = "Page zero, cold start, trampolines"
budget = 160
ranges = [["COMP_PAGE0_BEGIN", "COMP_PAGE0_END"], ["COMP_TRAMP_BEGIN", "COMP_TRAMP_END"]]

[[home.component]]
id = "platform"
title = "Retained platform (graphics, memory, keyboard, math, interrupt, bank, AY) + deltas"
budget = 3800
ranges = [["COMP_PLATFORM_BEGIN", "COMP_PLATFORM_END"]]

[[home.component]]
id = "tape_block"
title = "Tape block send/receive (moved from EXROM in Phase 7)"
budget = 340
ranges = []

[[home.component]]
id = "lexer"
title = "Compiler: lexer + source streaming + keyword table (+ compile error exit)"
budget = 1100
ranges = [["COMP_LEXER_BEGIN", "COMP_LEXER_END"]]

[[home.component]]
id = "decl"
title = "Compiler: declarations and type system"
budget = 2000
ranges = [["COMP_DECL_BEGIN", "COMP_DECL_END"]]

[[home.component]]
id = "symtab"
title = "Compiler: scoped symbol table"
budget = 800
ranges = [["COMP_SYMTAB_BEGIN", "COMP_SYMTAB_END"]]

[[home.component]]
id = "expr"
title = "Compiler: typed expressions"
budget = 1800
ranges = [["COMP_EXPR_BEGIN", "COMP_EXPR_END"]]

[[home.component]]
id = "codegen"
title = "Compiler: code generator (templates, fixups, constant folding)"
budget = 1200
ranges = [["COMP_CODEGEN_BEGIN", "COMP_CODEGEN_END"]]

[[home.component]]
id = "stmt"
title = "Compiler: statements and functions"
budget = 1400
ranges = [["COMP_STMT_BEGIN", "COMP_STMT_END"]]

[[home.component]]
id = "preproc"
title = "Compiler: preprocessor (object-like #define)"
budget = 300
ranges = []

[[home.component]]
id = "helpers"
title = "Runtime: helper core"
budget = 500
ranges = [["COMP_HELPERS_BEGIN", "COMP_HELPERS_END"]]

[[home.component]]
id = "library"
title = "Runtime: library"
budget = 1300
ranges = [["COMP_LIBRARY_BEGIN", "COMP_LIBRARY_END"]]

[[home.component]]
id = "rtexit"
title = "Runtime: start, exit, BREAK, runtime errors"
budget = 200
ranges = [["COMP_RTEXIT_BEGIN", "COMP_RTEXIT_END"]]

[exrom]
size = 8192
base = 0xC000
code_end = "LEAPC_EXROM_CODE_END"
reserve_floor = 256

[[exrom.component]]
id = "xplatform"
title = "Retained platform (editor engine, tape headers, integer formatting, sound)"
budget = 1340
ranges = [["COMP_XPLATFORM_BEGIN", "STORAGE_SEND_BLOCK"],
          ["STORAGE_VERSION_WORD", "BASIC_FLOAT_TO_STRING_EXROM"]]

[[exrom.component]]
id = "xtape_block"
title = "Tape block send/receive (in EXROM until Phase 7; ledger L1)"
budget = 0
ranges = [["STORAGE_SEND_BLOCK", "STORAGE_VERSION_WORD"]]

[[exrom.component]]
id = "xshell"
title = "Leap-C shell (entry points, editor glue, commands, messages, chime)"
budget = 2900
ranges = [["COMP_XSHELL_BEGIN", "COMP_XCOMP_ENTRY"], ["COMP_XCOMP_ENTRY_END", "COMP_XSHELL_END"]]

[[exrom.component]]
id = "xkeywords"
title = "C keyword highlighting table"
budget = 250
ranges = []

[[exrom.component]]
id = "xdiag"
title = "Compiler diagnostics (message texts, error reporting)"
budget = 650
ranges = []

[[exrom.component]]
id = "xcomp"
title = "Compiler parts run through HOME trampolines (constant folding; ledger L5)"
budget = 0
ranges = [["COMP_XCOMP_ENTRY", "COMP_XCOMP_ENTRY_END"], ["COMP_XCOMP_BEGIN", "COMP_XCOMP_END"]]

[[exrom.component]]
id = "xfp"
title = "FP calculator + float formatting (optional component, spec.md 4.9)"
budget = 2165
ranges = [["BASIC_FLOAT_TO_STRING_EXROM", "COMP_XPLATFORM_END"]]

# ---------------------------------------------------------------------------------------------
# Ledger: every change to a base budget, with its measured reason. `delta` is added to the
# component's budget and taken from (negative: returned to) the bank's reserve.

[[ledger]]
id = "L1"
date = "2026-10-13"
milestone = "M1.1"
bank = "exrom"
component = "xtape_block"
delta = 331
reason = """STORAGE_SEND_BLOCK + STORAGE_RECEIVE_BLOCK measure 331 B and stay in the EXROM until
Phase 7 moves them to HOME (spec.md 8.3, HOME budget tape_block 340). Transitional allocation
from the EXROM reserve (887 -> 556). Phase 7 removes this entry when the code moves."""

[[ledger]]
id = "L2"
date = "2026-10-13"
milestone = "M1.2"
bank = "home"
component = "symtab"
delta = -400
reason = """The scoped symbol table measures 295 B (workspace allocator, chains, lookup, scopes). 400 B
are returned to the HOME reserve; 105 B stay for Phase 2's label lookup."""

[[ledger]]
id = "L3"
date = "2026-10-13"
milestone = "M1.2"
bank = "home"
component = "decl"
delta = 1000
reason = """Declarations and types measure 2,949 B after the shrink pass (3,258 B first build; function
bodies and blocks, 169 B, moved to the stmt component). The 2,000 B base covers the declaration
parser and type system; M1.2 also delivers what spec.md 2.2 has no line for: initialisers with
brace elision and the `[]` counting pass (INIT_* 400 B), static data allocation in the image
regions and string staging (122 B), and the parser support shared by the whole compiler (mark and
rewind, group skipping, cell save, the error exits: 215 B). 1,000 B from the reserve (with
L2's 400 B): HOME reserve 1,484 -> 884 B, floor 512 B. Shrink candidates kept open in
docs/milestones/M1.2.md."""

[[ledger]]
id = "L4"
date = "2026-10-13"
milestone = "M1.3"
bank = "home"
component = "helpers"
delta = -340
reason = """The helper core measures 107 B in src/runtime/helpers.asm (ENTER's stack check, the rest of
CMPLT, CALLHL, MUL, DIVS/DIVU, MODS/MODU, SHL/SHR/SAR, CPL) plus 30 B of bodies in the page-zero RST
slots, counted in page0 (LDI 5, STI 6, LEAVE 5, ENTER 6, CMPLT 8). 160 B stay for Phase 2's SWITCH
helper; 340 B return to the HOME reserve."""

[[ledger]]
id = "L5"
date = "2026-10-13"
milestone = "M1.3"
bank = "exrom"
component = "xcomp"
delta = 222
reason = """Shrink protocol step 2 (cold code to EXROM): constant folding (XC_FOLD and its comparison
table, 219 B, src/compiler/fold.asm) and its EXROM entry jump (3 B) run with the EXROM paged in. It is
pure register arithmetic that touches nothing in chunk 6 and raises no compile error (bank rule 3),
reached through the HOME trampoline CX_FOLD (11 B, page0's trampoline budget). EXROM reserve
556 -> 334 B, floor 256 B."""

[[ledger]]
id = "L6"
date = "2026-10-13"
milestone = "M1.3"
bank = "home"
component = "expr"
delta = 841
reason = """The typed expression compiler measures 2,641 B after the M1.3 shrink pass (2,718 B first
build). The 1,800 B base assumed the M1.2 constant-expression parser (1,404 B) was most of it; M1.3
adds code for every operator: assignment and compound assignment with lvalue holding (139 B), calls
with right-to-left argument evaluation by re-scanning the argument list (333 B), ++/-- (92 B), ?:
(164 B) and && || (131 B) with compile-time selection under constant conditions, implicit function
declarations, function designators and frame operands in primary expressions (+123 B), lvalue
checks with const enforcement (60 B). Feasibility estimate for expressions: 1.4-2.0 KB. From the
reserve together with L4, L7 and the provisional L8."""

[[ledger]]
id = "L7"
date = "2026-10-13"
milestone = "M1.3"
bank = "home"
component = "codegen"
delta = 140
reason = """The code generator measures 1,340 B after constant folding moved to the EXROM (L5) and the
shrink pass (1,692 B first build): instruction units with region chaining and the code reserve
(130 B), operand loads and stores for every operand kind with byte extension and far frame objects
(~300 B), binary operators with held operands, constant special cases and the helper table
(~520 B), conditions and jumps with fixup chains (~110 B), function-address fixup chains (50 B),
droppable value tails (46 B). From the reserve together with L4, L6 and the provisional L8."""

[[ledger]]
id = "L8"
date = "2026-10-13"
milestone = "M1.3"
bank = "home"
component = "stmt"
delta = -269
reason = """PROVISIONAL (owner decision 2026-10-13): after shrinking, L5 and L4, M1.3 was 269 B short of
the HOME reserve floor. 269 B of the statements component's unused budget (954 B left after M1.3's
function code, return, expression statements and end-of-compile checks, 446 B) are lent to M1.3
(L6, L7). This is a temporary allocation, not a demonstrated saving: Phase 2 measures the statement
compiler and, if it needs these bytes, applies the shrink/reallocation protocol; any decision
that would take a reserve below its floor goes back to the owner. Phase 2's language features and
tests are not reduced to fit. HOME reserve after M1.3: 512 B (the floor)."""

[[ledger]]
id = "L9"
date = "2026-10-13"
milestone = "Phase 2"
bank = "home"
component = "platform"
delta = -351
reason = """Owner decisions O1/O2 (spec.md v0.3, platform delta D3): the V2 16-bit math is cut to
MATH_NEGATE16, MATH_ABS16 and MATH_COMPARE16 (39 B). Removed, measured on the production image:
MATH_UMUL16 22, MATH_UDIV16 74, MATH_MULTIPLY16 11, MATH_SIGN_PREP 16, MATH_APPLY_SIGN 7,
MATH_DIVIDE16 10, MATH_MOD16 22, MATH_SGN16 21, MATH_SQRT16 81, MATH_RND16 87 (351 B). C's
multiply and divide are now the helper core's (L10), rand()/srand() the library's (36 B, within its
budget). The platform keeps 138 B for the Phase 3 ISR delta and the Phase 5 glyphs, as before."""

[[ledger]]
id = "L10"
date = "2026-10-13"
milestone = "Phase 2"
bank = "home"
component = "helpers"
delta = 14
reason = """The helper core measures 174 B after the Phase 2 shrink: its own register-only multiply
(RT_MUL/RT_UMUL 19 B, 951 T for 123 x 45) and restoring divide (RT_DIVU/RT_UDIV 39 B, signed
RT_DIVS/RT_MODS 34 B; 1.6-1.9 kT) replace the 24 B of wrappers over the V2 math (L9); RT_MODU
(5 B) and the runtime error exits (13 B, rtexit) moved into page-zero padding (shrink S7); one
`jp (hl)` serves ENTER and RT_CALLHL (S6). From the platform's L9 bytes."""

[[ledger]]
id = "L11"
date = "2026-10-13"
milestone = "Phase 2"
bank = "home"
component = "stmt"
delta = 269
reason = """Repays the provisional L8 from measured savings (owner instruction for Phase 2): the
platform's 351 B (L9) less the helper core's 14 B (L10) leave 337 B, of which 269 B restore the
statements budget to its spec.md 2.2 value of 1,400 B and 68 B go to the HOME reserve (512 -> 580
B). The compiler components keep their own shrink savings (S1-S5: decl 21, expr 18, codegen 17,
stmt 3, symtab 1 B) as headroom for Phase 2 (preprocessor marks in decl, statements)."""
